<!doctype html>
<!-- Minimal player-facing shell for a free game. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evanopolis</title>
    <link rel="stylesheet" href="./styles.css?v=umvukurv-6703abea" />
  </head>
  <body class="free-client-body">
    <main class="free-client-shell">
      <iframe class="free-game-frame" id="game-frame" title="Evanopolis game" allow="fullscreen" tabindex="-1" hidden></iframe>
      <section class="paid-client-message" id="loading-panel" aria-live="polite">
        <h1>Opening your game</h1>
        <p>Please wait while the game loads.</p>
      </section>
      <section class="paid-client-message" id="game-launch-panel" hidden>
        <h1>Ready to play</h1>
        <p>For the best experience, the game opens fullscreen in landscape.</p>
        <button class="paid-client-button" id="game-launch-button" type="button">Launch game</button>
        <p class="paid-client-hint" id="game-launch-status" role="status"></p>
      </section>
      <section class="paid-client-message" id="free-client-error" hidden>
        <h1>Game unavailable</h1>
        <p>The game could not be opened. Return to the invitation and try again.</p>
        <a class="paid-client-secondary-action" id="return-to-free-entry" href="./free-entry.html">Return to invitation</a>
      </section>
      <p class="build-version">Version umvukurv · Updated 2026-09-25 11:29 -03</p>
    </main>
    <script src="./free-client.js?v=umvukurv-56a4874a"></script>
  </body>
</html>
