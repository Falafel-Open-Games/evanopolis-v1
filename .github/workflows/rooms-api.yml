name: Rooms API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rooms-api.yml
      - apps/rooms-api/**
      - deploy/docker/rooms-api/**
      - deploy/fly/rooms-api/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/falafel-open-games/evanopolis-v1-rooms-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/rooms-api/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/rooms-api

      - name: Run rooms-api tests
        run: npm test --prefix apps/rooms-api

  publish-image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/rooms-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy-staging:
    needs: publish-image
    runs-on: ubuntu-latest
    environment:
      name: rooms-api-staging
      url: https://evanopolis-v1-rooms-api-staging.fly.dev/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy staging to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c deploy/fly/rooms-api/fly.toml --ha=false

      - name: Smoke-check staging
        run: deploy/fly/rooms-api/smoke-check.sh https://evanopolis-v1-rooms-api-staging.fly.dev
