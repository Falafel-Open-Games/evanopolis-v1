app = "evanopolis-v1-rooms-api-staging"
primary_region = "gru"

[build]
  dockerfile = "../../docker/rooms-api/Dockerfile"
  build_context = "../.."

[env]
  HOST = "0.0.0.0"
  PORT = "3001"
  AUTH_BASE_URL = "https://tabletop-auth.fly.dev"
  AUTH_VERIFY_PATH = "/whoami"
  ALLOWED_ORIGINS = "https://falafel-open-games.github.io,https://www.falafel.com.br,https://falafel.com.br,https://evanopolis.falafel.com.br,http://127.0.0.1:4173,http://localhost:4173"
  ROOMS_DATA_FILE = "/data/rooms.json"

[mounts]
  source = "rooms_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"
