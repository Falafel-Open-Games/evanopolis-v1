app = "evanopolis-v1-game-server-staging"
primary_region = "gru"

[build]
  dockerfile = "../../docker/game-server/Dockerfile"
  build_context = "../.."

[env]
  HOST = "0.0.0.0"
  PORT = "8788"
  EVANOPOLIS_ROOMS_API_URL = "https://evanopolis-v1-rooms-api-staging.fly.dev"
  EVANOPOLIS_AUTH_API_URL = "https://tabletop-auth.fly.dev"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
